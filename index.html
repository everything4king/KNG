<!-- =========================
     KNG HERO 3D LOGO
========================= -->

<style>
/* KNG 3D HERO WRAPPER */
.kng-hero-logo-wrap {
    position: relative;
    width: min(720px, 82vw);
    height: 280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
}

/* MOVING SHADOW UNDER KNG */
.kng-hero-shadow {
    position: absolute;
    width: 62%;
    height: 55px;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    border-radius: 50%;
    
    background:
        radial-gradient(
            ellipse,
            rgba(212, 166, 42, 0.55) 0%,
            rgba(212, 166, 42, 0.28) 35%,
            rgba(212, 166, 42, 0.10) 60%,
            transparent 75%
        );

    filter: blur(25px);

    animation: kngShadowMove 6s ease-in-out infinite;
    
    z-index: 0;
    pointer-events: none;
}


/* MAIN KNG */
.kng-hero-logo {
    position: relative;
    z-index: 2;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(110px, 18vw, 235px);

    font-weight: 900;

    letter-spacing: -0.09em;

    line-height: 0.8;

    color: transparent;

    /* GOLD METALLIC FACE */
    background:
        linear-gradient(
            180deg,
            #fff4bd 0%,
            #f4d875 10%,
            #d9aa32 27%,
            #a87817 48%,
            #e4bb48 67%,
            #fff0a5 83%,
            #a87514 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    /* GOLD GLOW */
    filter:
        drop-shadow(0 2px 0 #6f4c0b)
        drop-shadow(0 6px 0 #503707)
        drop-shadow(0 10px 10px rgba(0,0,0,0.75))
        drop-shadow(0 0 18px rgba(214,166,42,0.22));

    transform-style: preserve-3d;

    transform-origin: center center;

    animation: kngHeroMotion 6s ease-in-out infinite;

    user-select: none;
    pointer-events: none;

    will-change: transform, filter;
}


/* EXTRA 3D DEPTH */
.kng-hero-logo::after {
    content: "KNG.";

    position: absolute;
    inset: 0;

    color: #6f4c0b;

    transform:
        translate3d(0, 11px, -12px);

    z-index: -1;

    opacity: 0.85;

    filter: blur(0.5px);
}


/* MAIN ROTATION + ZOOM */
@keyframes kngHeroMotion {

    0% {
        transform:
            perspective(1200px)
            rotateY(0deg)
            rotateX(0deg)
            scale(0.92);
    }

    12.5% {
        transform:
            perspective(1200px)
            rotateY(45deg)
            rotateX(2deg)
            scale(0.98);
    }

    25% {
        transform:
            perspective(1200px)
            rotateY(90deg)
            rotateX(0deg)
            scale(1.04);
    }

    37.5% {
        transform:
            perspective(1200px)
            rotateY(135deg)
            rotateX(-2deg)
            scale(1.08);
    }

    50% {
        transform:
            perspective(1200px)
            rotateY(180deg)
            rotateX(0deg)
            scale(1.10);
    }

    62.5% {
        transform:
            perspective(1200px)
            rotateY(225deg)
            rotateX(2deg)
            scale(1.06);
    }

    75% {
        transform:
            perspective(1200px)
            rotateY(270deg)
            rotateX(0deg)
            scale(1.02);
    }

    87.5% {
        transform:
            perspective(1200px)
            rotateY(315deg)
            rotateX(-2deg)
            scale(0.97);
    }

    100% {
        transform:
            perspective(1200px)
            rotateY(360deg)
            rotateX(0deg)
            scale(0.92);
    }
}


/* SHADOW FOLLOWS THE ZOOM */
@keyframes kngShadowMove {

    0% {
        transform:
            translateX(-50%)
            scale(0.72);

        opacity: 0.30;

        filter: blur(22px);
    }

    12.5% {
        transform:
            translateX(-48%)
            scale(0.82);

        opacity: 0.38;

        filter: blur(24px);
    }

    25% {
        transform:
            translateX(-45%)
            scale(0.94);

        opacity: 0.48;

        filter: blur(26px);
    }

    37.5% {
        transform:
            translateX(-42%)
            scale(1.08);

        opacity: 0.58;

        filter: blur(29px);
    }

    50% {
        transform:
            translateX(-50%)
            scale(1.18);

        opacity: 0.70;

        filter: blur(32px);
    }

    62.5% {
        transform:
            translateX(-57%)
            scale(1.10);

        opacity: 0.58;

        filter: blur(29px);
    }

    75% {
        transform:
            translateX(-55%)
            scale(0.96);

        opacity: 0.47;

        filter: blur(26px);
    }

    87.5% {
        transform:
            translateX(-52%)
            scale(0.83);

        opacity: 0.38;

        filter: blur(24px);
    }

    100% {
        transform:
            translateX(-50%)
            scale(0.72);

        opacity: 0.30;

        filter: blur(22px);
    }
}


/* MOBILE */
@media (max-width: 600px) {

    .kng-hero-logo-wrap {
        height: 190px;
    }

    .kng-hero-logo {
        font-size: clamp(80px, 24vw, 145px);
    }

    .kng-hero-shadow {
        bottom: 8px;
        width: 65%;
        height: 35px;
    }
}


/* REDUCED MOTION ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {

    .kng-hero-logo,
    .kng-hero-shadow {
        animation: none;
    }
}
</style>


<!-- =========================
     HERO KNG
========================= -->

<div class="kng-hero-logo-wrap">

    <div class="kng-hero-shadow"></div>

    <div class="kng-hero-logo">
        KNG.
    </div>

</div>
